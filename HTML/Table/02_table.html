<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested table</title>
</head>

<body>
    <table border="2" align="center" cellspacing="0" cellpadding="5">
        <tr>
            <th rowspan="2" colspan="2">CI</th>
            <th rowspan="2">All <br>Genders</th>
            <th colspan="2">By <br>Gender</th>
        </tr>
        <tr>
            <td>
                <table border="2" align="center" cellspacing="0" cellpadding="5">
                    <tr>
                        <th>Males</th>
                        <th>Females</th>
                    </tr>
                    <tr>
                        <td>6521458</td>
                        <td>4215389</td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <th>Rural</th>
            <td>6521458</td>
            <td>4215389</td>
            <td align="center">4152348</td>
        </tr>
    </table>
</body>

</html>
