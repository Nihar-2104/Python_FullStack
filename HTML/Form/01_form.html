    <form action="#">

        <label for="firstname">Firstname</label>
        <input type="text" id="firstname" name="firstname" required minlength="2" maxlength="30" pattern="[A-Za-z]+"
            title="First name must contain only letters and be between 2 to 30 characters long.">
        <br><br>

        <label for="middlename">Middlename:</label>
        <input type="text" id="middlename" name="middlename" maxlength="30" pattern="[A-Za-z]*"
            title="Middle name must contain only letters.">
        <br><br>

        <label for="lastname">Lastname:</label>
        <input type="text" id="lastname" name="lastname" required minlength="2" maxlength="30" pattern="[A-Za-z]+"
            title="Last name must contain only letters and be between 2 to 30 characters long.">
        <br><br>

        <label for="course">Course :</label>
        <select id="course" name="course" required>
            <option value="" disabled selected>Course</option>
            <option value="science">Science</option>
            <option value="commerce">Commerce</option>
            <option value="arts">Arts</option>
        </select>
        <br><br>

        <label>Gender :</label><br>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label><br>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
        <br><br>

        <label for="phone">Phone :</label>
        <input type="text" value="+91" size="2" readonly>
        <input type="tel" id="phone" name="phone" required minlength="10" maxlength="10" pattern="[0-9]{10}"
            title="Please enter exactly 10 digits.">
        <br><br>

        <label for="address">Address</label><br>
        <textarea id="address" name="address" rows="4" cols="50" required minlength="10" maxlength="250"
            title="Address must be between 10 and 250 characters."></textarea>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required minlength="8" maxlength="20"
            pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,20}"
            title="Must contain at least one number, one uppercase, one lowercase letter, and be 8 to 20 characters long.">
        <br><br>

        <label for="repassword">Re-type password:</label>
        <input type="password" id="repassword" name="repassword" required minlength="8" maxlength="20">
        <br><br>

        <input type="submit" value="Submit">

    </form>
