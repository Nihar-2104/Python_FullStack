<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Form</title>
</head>
<body>

    <form>
        <fieldset>
            <legend>Customer</legend>
            <table>
                <tr>
                    <td><label for="name">Name<font color="red">*</font></label></td>
                    <td>
                        <input type="text" id="name" name="name" required minlength="2" maxlength="50" pattern="^[a-zA-Z\s]+$" title="Only letters and spaces are allowed.">
                    </td>
                </tr>
                <tr>
                    <td><label for="email">Email<font color="red">*</font></label></td>
                    <td>
                        <input type="email" id="email" name="email" required minlength="5" maxlength="100">
                    </td>
                </tr>
                <tr>
                    <td><label for="investment">Investment</label></td>
                    <td>
                        <select id="investment" name="investment">
                            <option value=""></option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="dateJoined">Date Joined<font color="red">*</font></label></td>
                    <td>
                        <input type="date" id="dateJoined" name="dateJoined" required>
                    </td>
                </tr>
                <tr>
                    <td><label for="active">Active</label></td>
                    <td>
                        <input type="checkbox" id="active" name="active">
                    </td>
                </tr>
            </table>
        </fieldset>
        
        <br>
        
        <!-- Standard submit and reset buttons -->
        <button type="submit">OK</button>
        <button type="reset">Cancel</button>
    </form>

</body>
</html>
