<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
</head>
<body>

    <h1>Sign Up</h1>

    <form action="#" method="POST">
        
        <div>
            <label for="first_name">First, Last Name*:</label>
            <input type="text" id="first_name" name="first_name" placeholder="First Name" required minlength="2" maxlength="50" pattern="[A-Za-z\s\-]+" title="Please enter a valid first name (letters, spaces, and hyphens only).">
            <input type="text" id="last_name" name="last_name" placeholder="Last Name" required minlength="2" maxlength="50" pattern="[A-Za-z\s\-]+" title="Please enter a valid last name (letters, spaces, and hyphens only).">
        </div>
        <br>

        <div>
            <label for="organization">Organization:</label>
            <input type="text" id="organization" name="organization" minlength="2" maxlength="100">
        </div>
        <br>

        <div>
            <label for="email">Email address*:</label>
            <input type="email" id="email" name="email" required minlength="5" maxlength="100" title="Please enter a valid email address.">
        </div>
        <br>

        <div>
            <label for="work_phone">Work Phone:</label>
            <input type="tel" id="work_phone" name="work_phone" minlength="7" maxlength="15" pattern="[\+]?[0-9\s\-\(\)]+" title="Please enter a valid phone number (e.g., 555-123-4567).">
        </div>
        <br>

        <div>
            <label for="home_phone">Home Phone:</label>
            <input type="tel" id="home_phone" name="home_phone" minlength="7" maxlength="15" pattern="[\+]?[0-9\s\-\(\)]+" title="Please enter a valid phone number.">
        </div>
        <br>

        <div>
            <label for="cell_phone">Cell Phone:</label>
            <input type="tel" id="cell_phone" name="cell_phone" minlength="7" maxlength="15" pattern="[\+]?[0-9\s\-\(\)]+" title="Please enter a valid phone number.">
        </div>
        <br>

        <div>
            <label for="fax">Fax:</label>
            <input type="tel" id="fax" name="fax" minlength="7" maxlength="15" pattern="[\+]?[0-9\s\-\(\)]+" title="Please enter a valid fax number.">
        </div>
        <br>

        <div>
            <label for="address1">Address 1*:</label>
            <input type="text" id="address1" name="address1" required minlength="5" maxlength="255">
        </div>
        <br>

        <div>
            <label for="address2">Address 2:</label>
            <input type="text" id="address2" name="address2" maxlength="255">
        </div>
        <br>

        <div>
            <label for="city">City*:</label>
            <input type="text" id="city" name="city" required minlength="2" maxlength="100" pattern="[A-Za-z\s\-]+" title="City names should contain only letters, spaces, and hyphens.">
        </div>
        <br>

        <div>
            <label for="state">State/Province:</label>
            <input type="text" id="state" name="state" minlength="2" maxlength="50" pattern="[A-Za-z\s\-]+" title="State/Province should contain only letters, spaces, and hyphens.">
        </div>
        <br>

        <div>
            <label for="zip">Zip/Postal Code:</label>
            <input type="text" id="zip" name="zip" minlength="3" maxlength="12" pattern="[a-zA-Z0-9\s\-]+" title="Please enter a valid Zip or Postal Code.">
        </div>
        <br>

        <div>
            <label for="country">Country*:</label>
            <input type="text" id="country" name="country" required minlength="2" maxlength="100" pattern="[A-Za-z\s\-]+" title="Country should contain only letters, spaces, and hyphens.">
        </div>
        <br>

        <div>
            <span>* - required fields</span>
        </div>
        <br>

        <div>
            <button type="submit">Submit</button>
        </div>

    </form>

</body>
</html>
