<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Style Restaurant Card</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            padding: 2rem;
        }

        /* Card Container styling */
        article {
            background-color: white;
            border-radius: 15px;
            width: 320px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        article:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }

        /* Image styling */
        article img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        /* Header styling (Restaurant Name & Cuisine) */
        header {
            padding: 1rem 1rem 0.5rem 1rem;
        }

        header h2 {
            margin: 0 0 0.25rem 0;
            font-size: 1.25rem;
            color: #1c1c1c;
        }

        header p {
            margin: 0;
            font-size: 0.9rem;
            color: #696969;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Cost details */
        .cost {
            padding: 0 1rem 1rem 1rem;
            font-size: 0.9rem;
            color: #696969;
            border-bottom: 1px solid #e8e8e8;
        }

        /* Footer styling (Rating & Delivery Time) */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background-color: #fafafa;
        }

        .rating {
            background-color: #24963f;
            color: white;
            font-weight: bold;
            font-size: 0.85rem;
            padding: 0.3rem 0.5rem;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .delivery-time {
            font-size: 0.85rem;
            font-weight: 600;
            color: #333;
        }
    </style>
</head>
<body>

    <!-- Semantic HTML Article representing a single restaurant -->
    <article>
        <!-- Restaurant Image -->
        <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Delicious Pizza">
        
        <!-- Header containing the restaurant name -->
        <header>
            <h2>The Pizza Oven</h2>
            <p>Italian, Pizzas, Fast Food</p>
        </header>

        <!-- Additional info -->
        <div class="cost">
            ₹400 for two
        </div>

        <!-- Footer containing the rating and delivery time -->
        <footer>
            <div class="rating">4.2 ★</div>
            <div class="delivery-time">30-40 min</div>
        </footer>
    </article>

</body>
</html>
