<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f3f3f3;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .card {
        background: #ffffff;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 360px;
      }

      .profile-name {
        color: #222222;
        margin-bottom: 10px;
      }

      .profile-pic {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #eaeaea;
        margin: 15px 0;
      }

      .bio {
        color: #555555;
        line-height: 1.6;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 class="profile-name">Nihar Patel</h1>
      <img
        class="profile-pic"
        src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=500&q=80"
        alt="Profile picture"
      />
      <p class="bio">
        I am a student who loves learning web design, coding, and creating clean,
        creative digital experiences.
      </p>
    </div>
  </body>
</html>
