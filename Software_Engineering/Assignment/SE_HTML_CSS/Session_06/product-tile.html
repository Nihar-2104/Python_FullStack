<!DOCTYPE html>
<html>
<head>
    <title>Product Tile</title>
    <style>
        .product-tile {
            border: 1px solid #f0f0f0;
            padding: 15px;
            width: 200px;
            font-family: Arial, sans-serif;
            text-align: center;
            /* inline-block lets tiles sit next to each other */
            display: inline-block; 
        }

        .product-image {
            width: 120px;
            height: 150px;
            background-color: #ccc; /* Placeholder for image */
            display: inline-block;
        }

        .product-name {
            /* block makes it take the whole row */
            display: block; 
            font-weight: bold;
            margin: 10px 0;
            color: #212121;
        }

        .product-price {
            /* inline-block keeps it properly aligned in its own space */
            display: inline-block; 
            font-size: 18px;
            font-weight: bold;
            color: #000;
        }

        /* Toggling this class will hide the price */
        .hide-price .product-price {
            display: none; /* Hides the element completely from the screen */
        }
    </style>
</head>
<body>

    <!-- Note: Add 'hide-price' next to 'product-tile' to see the price disappear -->
    <div class="product-tile">
        <div class="product-image"></div> <!-- Image placeholder -->
        <span class="product-name">SAMSUNG Galaxy F14</span>
        <span class="product-price">₹12,490</span>
    </div>

</body>
