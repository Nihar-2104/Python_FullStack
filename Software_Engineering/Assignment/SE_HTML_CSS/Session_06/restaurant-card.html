<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Card</title>
    <style>
        /* Card container styling */
        .restaurant-card {
            border: 2px solid #e8e8e8; /* Visible border */
            padding: 20px;             /* Space inside the card */
            margin: 20px;              /* Space outside the card */
            width: 250px;
            font-family: Arial, sans-serif;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .restaurant-name {
            margin: 0 0 5px 0;
            color: #333;
        }

        .cuisine-type {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .rating {
            background-color: #24963f; /* Zomato green */
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="restaurant-card">
        <h2 class="restaurant-name">Burger King</h2>
        <div class="cuisine-type">Fast Food, Beverages</div>
        <span class="rating">4.2 ★</span>
    </div>

</body>
</html>
