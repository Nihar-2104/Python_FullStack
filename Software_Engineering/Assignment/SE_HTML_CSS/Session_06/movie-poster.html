<!DOCTYPE html>
<html>
<head>
    <title>Movie Poster Grid</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .poster {
            /* relative makes this div the anchor point for the absolute badge */
            position: relative; 
            display: inline-block; /* allows posters to sit side-by-side */
            width: 180px;
            height: 250px;
            margin: 15px;
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
        }

        .movie-image {
            width: 100%;
            height: 200px;
            background-color: #999;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }

        .movie-title {
            margin-top: 10px;
            font-weight: bold;
        }

        .badge-new {
            /* absolute places it precisely based on the relative parent */
            position: absolute; 
            top: 10px; 
            left: 10px;
            
            background-color: #f84464; /* BookMyShow pinkish red */
            color: white;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Poster 1: With the NEW badge -->
    <div class="poster">
        <div class="badge-new">NEW</div>
        <div class="movie-image"></div>
        <div class="movie-title">Fighter</div>
    </div>

    <!-- Poster 2: Standard poster without badge -->
    <div class="poster">
        <div class="movie-image"></div>
        <div class="movie-title">Animal</div>
    </div>

</body>
</html>
