<!DOCTYPE html>
<html>
<head>
    <title>Refactored CSS</title>
    <style>
        /* 
         * Reusable utility class for spacing.
         * Using this improves maintainability because it keeps our code DRY (Don't Repeat Yourself). 
         * Any element needing standard spacing can just use this class.
         */
        .spacing-box {
            padding: 20px;
            margin: 20px;
        }

        /* Specific card styling without padding and margin */
        .restaurant-card {
            border: 2px solid #e8e8e8;
            width: 250px;
            font-family: Arial, sans-serif;
            border-radius: 8px;
        }

        .rating {
            background-color: #24963f;
            color: white;
            padding: 4px 8px; /* specific internal padding */
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Notice how we apply both classes to the div here -->
    <div class="restaurant-card spacing-box">
        <h2>Burger King</h2>
        <p>Fast Food, Beverages</p>
        <span class="rating">4.2 ★</span>
    </div>

</body>
</html>
