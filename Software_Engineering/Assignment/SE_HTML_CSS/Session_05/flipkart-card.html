<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <div
        style="border: 1px solid #e0e0e0; width: 220px; padding: 15px; font-family: Arial, sans-serif; text-align: center;">
        <img src="https://via.placeholder.com/150" alt="Product Image" style="width: 100%; margin-bottom: 10px;">

        <!-- Inline CSS applied to the title only -->
        <h3 style="background-color: #f2f2f2; font-size: 16px; padding: 5px; color: #333; margin: 0 0 10px 0;">
            Smartphone Pro Max
        </h3>

        <p style="color: #388e3c; font-size: 18px; font-weight: bold; margin: 0 0 10px 0;">₹29,999</p>
        <button
            style="background-color: #ff9f00; border: none; color: white; padding: 8px 16px; cursor: pointer; font-weight: bold;">
            BUY NOW
        </button>
    </div>
</body>

</html>
