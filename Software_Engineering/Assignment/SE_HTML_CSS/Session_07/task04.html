<!DOCTYPE html>
<html>
<head>
    <title>Responsive Product Grid</title>
    <style>
        /* Base Grid (Desktop view: 3 columns) */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .product-card {
            background-color: white;
            border: 1px solid #ddd;
            padding: 15px;
            text-align: center;
            border-radius: 5px;
        }

        .product-card img {
            width: 100%;
            max-height: 150px;
            object-fit: cover;
        }

        /* Tablet View: 2 columns */
        @media (max-width: 768px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Mobile View: 1 column */
        @media (max-width: 480px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <h2>Responsive Products</h2>
    
    <div class="product-grid">
        <!-- Reusing the 6 cards from the previous question -->
        <div class="product-card"><img src="laptop.jpg" alt="Laptop"><h3>Laptop</h3></div>
        <div class="product-card"><img src="smartphone.jpg" alt="Phone"><h3>Smartphone</h3></div>
        <div class="product-card"><img src="shoes.jpg" alt="Shoes"><h3>Shoes</h3></div>
        <div class="product-card"><img src="watch.jpg" alt="Watch"><h3>Smartwatch</h3></div>
        <div class="product-card"><img src="headphones.jpg" alt="Headphones"><h3>Headphones</h3></div>
        <div class="product-card"><img src="bagpack.jpg" alt="Bag"><h3>Backpack</h3></div>
    </div>

</body>
</html>
