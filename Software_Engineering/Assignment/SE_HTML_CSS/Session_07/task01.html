<!DOCTYPE html>
<html>

<head>
    <title>Favorite Apps</title>
    <style>
        /* Container for the app icons */
        .icon-container {
            display: flex;
            /* Enables Flexbox */
            justify-content: space-around;
            /* Adds equal space around the items */
            background-color: #f0f0f0;
            padding: 20px;
            border-radius: 10px;
        }

        /* Styling the images to look like icons */
        .icon-container img {
            width: 80px;
            height: 80px;
            border-radius: 15px;
            /* Makes the corners rounded */
        }
    </style>
</head>

<body>

    <h2>My Favorite Apps</h2>

    <div class="icon-container">
        <img src="instagram.jpg" alt="Instagram">
        <img src="whatsapp.jpg" alt="WhatsApp">
        <img src="zomato.jpg" alt="Zomato">
        <img src="spotify.jpg" alt="Spotify">
    </div>

</body>

</html>
